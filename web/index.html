<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="双资源塔防：金币决定你有几个塔，功勋决定塔能长多高。">
<title>Tribes TD · 六部族塔防</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#05090E;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{
    position:relative;
    box-shadow:0 0 80px rgba(30,158,143,.18),0 0 180px rgba(0,0,0,.9);
    border-radius:6px;overflow:hidden;
    background:#0B1420;
  }
  canvas{display:block;width:100%;height:100%}

  #boot{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(circle at 50% 42%,#12202E 0%,#070C12 72%);
    transition:opacity .5s ease;color:#E8EFF5;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot .mark{
    font-size:44px;font-weight:800;letter-spacing:6px;
    background:linear-gradient(180deg,#FFFFFF,#8FB4CE);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #boot .sub{font-size:13px;color:#5F7A8E;letter-spacing:3px}
  #boot .bar{width:230px;height:3px;background:#17242F;border-radius:2px;overflow:hidden}
  #boot .bar i{
    display:block;height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#1E9E8F,#5BD1A6);
    transition:width .3s ease;
  }
  #boot .err{
    max-width:78%;font-size:12px;line-height:1.7;color:#E15555;
    text-align:center;white-space:pre-wrap;
  }
  #hint{
    position:absolute;left:0;right:0;bottom:0;height:0;
  }
  @media (max-height:520px){
    #boot .mark{font-size:30px}
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="cv"></canvas></div>

  <div id="boot">
    <div class="mark">TRIBES TD</div>
    <div class="sub">双资源塔防</div>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="err" id="booterr"></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
